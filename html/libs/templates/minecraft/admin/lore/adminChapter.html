    <div class="chapter" data-chapter="{ID}">
      <div class="chapterLink">Chapter {NUMBER}: {TITLE}
        <span><button class="editButton" data-overlay="user" data-index="{PLATFORM_USER_ID}">Edit</button></span>
        <span><button class="deleteButton" data-overlay="user" data-index="{PLATFORM_USER_ID}">Delete</button></span>
      </div>
      <div class="chapterContent">
        <div class="chapterActions">{ACTIONS}</div>
        <hr>
        <p>{TEXT}</p>
      </div>
    </div>
