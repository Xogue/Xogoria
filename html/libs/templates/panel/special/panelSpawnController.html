<div class="spawnRow" data-mob="{KEY}" data-cost="{COST}" data-cooldown="{COOLDOWN}">
  <div class="sLabel">{LABEL} <span class="sCost">{COST} AGs</span></div>
  <div class="sCtrls">
    <button type="button" class="sBtn dec">-</button>
    <input type="number" min="0" max="25" step="1" inputmode="numeric" value="0" aria-label="{LABEL} quantity">
    <button type="button" class="sBtn inc">+</button>
  </div>
</div>
