<div class="card cardBatClaim" data-cooldown="{COOLDOWN}" data-blocked="{BLOCKED}">
    <div class="cardLabel">{LABEL}</div>
    <div class="cardDuration">{DESCRIPTION}</div>
    <input type="text" class="batNameInput" maxlength="32" placeholder="Optional bat name" aria-describedby="batNameHint">
    <div id="batNameHint" class="batHint" aria-live="polite"></div>
    <button class="cardButton batClaimBtn" type="button">It's MY Bat!</button>
</div>
